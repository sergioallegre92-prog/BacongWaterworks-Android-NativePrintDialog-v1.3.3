name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk Bacong-Waterworks-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Bacong-Waterworks-Release-APK
          path: Bacong-Waterworks-release.apk
          if-no-files-found: error
          retention-days: 30
